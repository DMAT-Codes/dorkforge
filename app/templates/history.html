{% extends "base.html" %}

{% block title %}History{% endblock %}

{% block content %}
<div class="history-page">
    <div class="history-header">
        <div>
            <h1 class="history-title">📜 Saved Queries</h1>
            <p class="history-subtitle">Your bookmarked dorks stored in the database.</p>
        </div>
        <button id="clearHistoryBtn" class="btn btn-danger btn-sm">Delete All</button>
    </div>

    <div id="historyList" class="history-list">
        <p class="history-empty">Loading your saved queries...</p>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const historyList = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearHistoryBtn');

    // Fetch and render queries
    async function renderHistory() {
        try {
            const response = await fetch('/history/api/saved');
            
            // If user is somehow not logged in
            if (response.status === 401 || response.status === 302) {
                historyList.innerHTML = '<p class="history-empty">Please log in to view your queries.</p>';
                return;
            }

            const saved = await response.json();
            
            if (saved.length === 0) {
                historyList.innerHTML = '<p class="history-empty">No saved queries in database yet.</p>';
                return;
            }
            
            historyList.innerHTML = saved.map((item) => `
                <div class="history-item">
                    <div class="history-query">${item.query}</div>
                    <div class="history-meta">
                        <span class="history-time">${item.date}</span>
                        <div class="history-actions">
                            <button class="btn btn-sm btn-secondary" onclick="copyQuery('${item.query.replace(/'/g, "\\'")}')"><i class="fas fa-copy"></i></button>
                            <button class="btn btn-sm btn-primary" onclick="openQuery('${item.query.replace(/'/g, "\\'")}')"><i class="fas fa-external-link-alt"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteQuery(${item.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Error:', error);
            historyList.innerHTML = '<p class="history-empty" style="color:red;">Failed to load queries. Please refresh.</p>';
        }
    }

    // Global functions for buttons
    window.copyQuery = function(query) {
        navigator.clipboard.writeText(query);
        alert('Query copied to clipboard!');
    };

    window.openQuery = function(query) {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
    };

    window.deleteQuery = async function(id) {
        if (confirm('Delete this saved query?')) {
            await fetch(`/history/api/saved/${id}`, { method: 'DELETE' });
            renderHistory();
        }
    };

    // Delete All
    clearBtn.addEventListener('click', async function() {
        if (confirm('Delete ALL saved queries from database?')) {
            const response = await fetch('/history/api/saved');
            const saved = await response.json();
            for (let item of saved) {
                await fetch(`/history/api/saved/${item.id}`, { method: 'DELETE' });
            }
            renderHistory();
        }
    });

    renderHistory();
});
</script>
{% endblock %}
